<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Janiččiny Perníčky – Ručně zdobené perníčky na zakázku</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fdfbf7;
            color: #4a3b32;
            text-align: center;
        }
        header {
            background-color: #8c533e;
            color: white;
            padding: 40px 20px;
        }
        h1 { margin: 0; font-size: 2.5em; }
        p.subtitle { font-style: italic; font-size: 1.2em; opacity: 0.9; }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        .button {
            display: inline-block;
            background-color: #d97736;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 15px;
        }
        .button:hover { background-color: #b85e24; }
    </style>
</head>
<body>

    <header>
        <h1>Janiččiny Perníčky</h1>
        <p class="subtitle">Poctivé, ručně zdobené perníčky pro každou příležitost</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Vítejte v mém perníčkovém světě! 🍪</h2>
            <p>Příprava webu právě probíhá. Brzy zde najdete ukázky mé práce, svatebních i narozeninových sad a kontaktní formulář pro objednávky.</p>
            <a href="mailto:vas-email@seznam.cz" class="button">Napsat poptávku e-mailem</a>
        </div>
    </div>

</body>
</html>
